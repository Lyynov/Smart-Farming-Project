<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Smart Farming System Architecture</text>
  
  <!-- Raspberry Pi Server -->
  <rect x="350" y="100" width="120" height="80" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" />
  <text x="410" y="130" font-family="Arial" font-size="16" text-anchor="middle">Raspberry Pi 4</text>
  <text x="410" y="150" font-family="Arial" font-size="12" text-anchor="middle">Main Server</text>
  <text x="410" y="170" font-family="Arial" font-size="12" text-anchor="middle">Fuzzy Logic</text>
  
  <!-- ESP32 Node 1 -->
  <rect x="150" y="250" width="100" height="70" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle">ESP32 Node 1</text>
  <text x="200" y="300" font-family="Arial" font-size="12" text-anchor="middle">Soil Moisture</text>
  
  <!-- ESP32 Node 2 -->
  <rect x="550" y="250" width="100" height="70" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
  <text x="600" y="280" font-family="Arial" font-size="14" text-anchor="middle">ESP32 Node 2</text>
  <text x="600" y="300" font-family="Arial" font-size="12" text-anchor="middle">Soil Moisture</text>
  
  <!-- Camera -->
  <rect x="350" y="250" width="120" height="70" rx="5" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" />
  <text x="410" y="280" font-family="Arial" font-size="14" text-anchor="middle">Camera</text>
  <text x="410" y="300" font-family="Arial" font-size="12" text-anchor="middle">Computer Vision</text>
  
  <!-- Actuator Group 1 -->
  <rect x="110" y="400" width="180" height="80" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="2" />
  <text x="200" y="425" font-family="Arial" font-size="14" text-anchor="middle">Actuator Group 1</text>
  <text x="200" y="445" font-family="Arial" font-size="12" text-anchor="middle">Solenoid Valve</text>
  <text x="200" y="465" font-family="Arial" font-size="12" text-anchor="middle">Water Pump + Sprinkler</text>
  
  <!-- Actuator Group 2 -->
  <rect x="510" y="400" width="180" height="80" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="2" />
  <text x="600" y="425" font-family="Arial" font-size="14" text-anchor="middle">Actuator Group 2</text>
  <text x="600" y="445" font-family="Arial" font-size="12" text-anchor="middle">Solenoid Valve</text>
  <text x="600" y="465" font-family="Arial" font-size="12" text-anchor="middle">Water Pump + Sprinkler</text>
  
  <!-- Web Interface -->
  <rect x="350" y="400" width="120" height="80" rx="5" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" />
  <text x="410" y="430" font-family="Arial" font-size="14" text-anchor="middle">Web Interface</text>
  <text x="410" y="450" font-family="Arial" font-size="12" text-anchor="middle">Dashboard</text>
  <text x="410" y="470" font-family="Arial" font-size="12" text-anchor="middle">Monitoring</text>
  
  <!-- Connections -->
  <!-- RaspPi to ESP32 Nodes -->
  <line x1="350" y1="140" x2="200" y2="250" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5" />
  <text x="260" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#1976d2">WiFi/WSN</text>
  
  <line x1="470" y1="140" x2="600" y2="250" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5" />
  <text x="550" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#1976d2">WiFi/WSN</text>
  
  <!-- RaspPi to Camera -->
  <line x1="410" y1="180" x2="410" y2="250" stroke="#7b1fa2" stroke-width="2" />
  <text x="430" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#7b1fa2">Direct</text>
  
  <!-- ESP32 to Actuators -->
  <line x1="200" y1="320" x2="200" y2="400" stroke="#e65100" stroke-width="2" />
  <text x="220" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#e65100">Control</text>
  
  <line x1="600" y1="320" x2="600" y2="400" stroke="#e65100" stroke-width="2" />
  <text x="620" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#e65100">Control</text>
  
  <!-- RaspPi to Web -->
  <line x1="410" y1="180" x2="410" y2="400" stroke="#d32f2f" stroke-width="2" />
  <text x="440" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#d32f2f">Data</text>
  
  <!-- Legend -->
  <rect x="600" y="20" width="180" height="100" rx="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="690" y="40" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="620" y="50" width="15" height="15" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
  <text x="690" y="62" font-family="Arial" font-size="12" text-anchor="middle">Main Server</text>
  
  <rect x="620" y="70" width="15" height="15" fill="#bbdefb" stroke="#1976d2" stroke-width="1" />
  <text x="690" y="82" font-family="Arial" font-size="12" text-anchor="middle">Sensor Nodes</text>
  
  <rect x="620" y="90" width="15" height="15" fill="#ffe0b2" stroke="#e65100" stroke-width="1" />
  <text x="690" y="102" font-family="Arial" font-size="12" text-anchor="middle">Actuators</text>
</svg>