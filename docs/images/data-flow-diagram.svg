<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Smart Farming Data Flow Diagram</text>
  
  <!-- ESP32 Node 1 -->
  <rect x="50" y="100" width="200" height="100" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
  <text x="150" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ESP32 Node 1</text>
  <text x="150" y="155" font-family="Arial" font-size="12" text-anchor="middle">1. Read soil moisture sensor</text>
  <text x="150" y="175" font-family="Arial" font-size="12" text-anchor="middle">2. Send data via WSN</text>
  
  <!-- ESP32 Node 2 -->
  <rect x="50" y="220" width="200" height="100" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="2" />
  <text x="150" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">ESP32 Node 2</text>
  <text x="150" y="275" font-family="Arial" font-size="12" text-anchor="middle">1. Read soil moisture sensor</text>
  <text x="150" y="295" font-family="Arial" font-size="12" text-anchor="middle">2. Send data via WSN</text>
  
  <!-- Raspberry Pi Server -->
  <rect x="300" y="150" width="250" height="200" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" />
  <text x="425" y="175" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Raspberry Pi Server</text>
  <text x="425" y="200" font-family="Arial" font-size="12" text-anchor="middle">1. Receive soil moisture data</text>
  <text x="425" y="220" font-family="Arial" font-size="12" text-anchor="middle">2. Process with Fuzzy Logic</text>
  <text x="425" y="240" font-family="Arial" font-size="12" text-anchor="middle">3. Capture images using camera</text>
  <text x="425" y="260" font-family="Arial" font-size="12" text-anchor="middle">4. Process images with Computer Vision</text>
  <text x="425" y="280" font-family="Arial" font-size="12" text-anchor="middle">5. Determine valve control commands</text>
  <text x="425" y="300" font-family="Arial" font-size="12" text-anchor="middle">6. Send data to web interface</text>
  <text x="425" y="320" font-family="Arial" font-size="12" text-anchor="middle">7. Send control commands to ESP32s</text>
  
  <!-- Web Interface -->
  <rect x="600" y="150" width="150" height="100" rx="5" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" />
  <text x="675" y="180" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Web Interface</text>
  <text x="675" y="205" font-family="Arial" font-size="12" text-anchor="middle">1. Display sensor data</text>
  <text x="675" y="225" font-family="Arial" font-size="12" text-anchor="middle">2. Show plant status</text>
  <text x="675" y="245" font-family="Arial" font-size="12" text-anchor="middle">3. Control options</text>
  
  <!-- Actuators -->
  <rect x="600" y="270" width="150" height="80" rx="5" fill="#ffe0b2" stroke="#e65100" stroke-width="2" />
  <text x="675" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Actuators</text>
  <text x="675" y="325" font-family="Arial" font-size="12" text-anchor="middle">Solenoid Valves & Pump</text>
  
  <!-- Arrows -->
  <!-- ESP32 to Raspberry Pi -->
  <path d="M 250 150 L 300 200" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 250 270 L 300 250" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Raspberry Pi to Web Interface -->
  <path d="M 550 200 L 600 200" stroke="#d32f2f" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Raspberry Pi to Actuators -->
  <path d="M 550 250 L 600 300" stroke="#e65100" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Raspberry Pi to ESP32 (Control) -->
  <path d="M 300 230 L 250 180" stroke="#e65100" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <path d="M 300 280 L 250 300" stroke="#e65100" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="370" width="700" height="90" rx="5" fill="white" stroke="#333" stroke-width="1" />
  <text x="400" y="390" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Legend</text>
  
  <line x1="100" y1="410" x2="150" y2="410" stroke="#1976d2" stroke-width="2" />
  <text x="280" y="415" font-family="Arial" font-size="12" text-anchor="middle">Sensor Data Flow (ESP32 to Raspberry Pi)</text>
  
  <line x1="100" y1="430" x2="150" y2="430" stroke="#e65100" stroke-width="2" />
  <text x="280" y="435" font-family="Arial" font-size="12" text-anchor="middle">Control Commands (Raspberry Pi to Actuators)</text>
  
  <line x1="100" y1="450" x2="150" y2="450" stroke="#d32f2f" stroke-width="2" />
  <text x="280" y="455" font-family="Arial" font-size="12" text-anchor="middle">Web Data Flow (Raspberry Pi to Web Interface)</text>
  
  <line x1="410" y1="430" x2="460" y2="430" stroke="#e65100" stroke-width="2" stroke-dasharray="5,5" />
  <text x="600" y="435" font-family="Arial" font-size="12" text-anchor="middle">Control Commands (Raspberry Pi to ESP32)</text>
</svg>